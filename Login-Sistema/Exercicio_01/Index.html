<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Sistema </title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <form class="Login-form" id="formLogin">
        <h2>Login do Sistema</h2>

        <div class="campo">
            <p>Usuário: <input type="text" placeholder="Digite seu usuário" id="usuario"></p>
        </div>

        <div class="campo">
            <p>Senha: <input type="password" placeholder="Digite sua senha" id="senha"></p>
        </div>

        <input type="submit" value="Entrar" id="botao">
    </form>

    <script src="Script.js"></script>
</body>

</html>
